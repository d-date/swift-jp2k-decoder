name: CI
# Push runs only on main; branches are covered by their pull request, so a
# branch with an open PR is not built twice (the repository is private and
# CI minutes are billed).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS/iOS runners are deliberately absent (cost); Apple platforms are
  # verified locally before pushing. The public API check shares this job's
  # build instead of paying for another container.
  linux:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .conformance-data
          key: openjpeg-data-39524bd3a601d90ed8e0177559400d23945f96a9
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-linux-6.4.1-
      - name: Fetch conformance data
        run: bash Scripts/fetch-conformance.sh .conformance-data
      - name: Test
        env:
          JP2K_CONFORMANCE_DIR: ${{ github.workspace }}/.conformance-data
        run: swift test
      - name: Release decode timing
        run: swift run -c release jp2k-bench --quick
      - name: Check public API
        run: |
          # The swift image has no Python; api-dump.sh formats the symbol graph with it.
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 > /dev/null
          bash Scripts/api-dump.sh | diff -u docs/api.txt -

  windows:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows10
          - runner: windows-11-arm
            platform: windows10-arm64
    runs-on: ${{ matrix.runner }}
    env:
      SWIFT_INSTALLER: ${{ github.workspace }}/../swift-installer-6.4.1-${{ matrix.platform }}.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .conformance-data
          key: openjpeg-data-39524bd3a601d90ed8e0177559400d23945f96a9
      - uses: actions/cache@v4
        with:
          path: ${{ env.SWIFT_INSTALLER }}
          key: swift-installer-6.4.1-${{ matrix.platform }}
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ matrix.platform }}-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-${{ matrix.platform }}-6.4.1-
      # winget is not present on windows-11-arm, so both architectures use the
      # swift.org installer directly (the download is cached).
      - name: Install Swift 6.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = $env:SWIFT_INSTALLER
          if (-not (Test-Path $installer)) {
            $url = "https://download.swift.org/swift-6.4.1-release/${{ matrix.platform }}/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-${{ matrix.platform }}.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Swift installer failed with exit code $($process.ExitCode)" }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath;$env:Path"
          $env:Path -split ';' | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Append }
          # The installer also defines SDKROOT (and friends) for new sessions
          # only; later steps need them or swiftc cannot find the stdlib.
          foreach ($name in 'SDKROOT', 'DEVELOPER_DIR', 'SWIFT_DRIVER_SWIFT_FRONTEND_EXEC') {
            $value = [Environment]::GetEnvironmentVariable($name, 'Machine')
            if (-not $value) { $value = [Environment]::GetEnvironmentVariable($name, 'User') }
            if ($value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append
              Set-Item -Path "env:$name" -Value $value
            }
          }
          swift --version
      - name: Fetch conformance data
        run: bash Scripts/fetch-conformance.sh .conformance-data
      - name: Test
        shell: pwsh
        env:
          JP2K_CONFORMANCE_DIR: ${{ github.workspace }}/.conformance-data
        run: swift test
      - name: Release decode timing
        shell: pwsh
        run: swift run -c release jp2k-bench --quick

  android:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    env:
      SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz
      SWIFT_ANDROID_SDK_CHECKSUM: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
      SWIFT_ANDROID_SDK_ID: swift-6.4.1-RELEASE_android
      ANDROID_NDK_HOME: ${{ github.workspace }}/../android-ndk-r30
      AVD_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@v4
      # Toolchain, Swift SDK, NDK and emulator image are version-pinned, so
      # they are restored from cache instead of downloaded on every run.
      - uses: actions/cache@v4
        id: toolchains
        with:
          path: |
            ~/.local/share/swiftly
            ~/.swiftpm/swift-sdks
            ${{ env.ANDROID_NDK_HOME }}
          key: android-toolchains-swift-6.4.1-ndk-r30
      - uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk-extra
          key: android-emulator-35-google_apis-x86_64
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-android-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-android-6.4.1-
      - name: Install Swift, Swift Android SDK and NDK
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -xzf "$RUNNER_TEMP/swiftly.tar.gz" -C "$RUNNER_TEMP"
          # swiftly refuses to finish without the toolchain's system dependency.
          sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev > /dev/null
          "$RUNNER_TEMP/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          "$HOME/.local/share/swiftly/bin/swiftly" install 6.4.1
          "$HOME/.local/share/swiftly/bin/swift" sdk install "$SWIFT_ANDROID_SDK_URL" --checksum "$SWIFT_ANDROID_SDK_CHECKSUM"
          curl -fSL https://dl.google.com/android/repository/android-ndk-r30-Linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -qo "$RUNNER_TEMP/ndk.zip" -d "$(dirname "$ANDROID_NDK_HOME")"
      - name: Set up paths
        run: |
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$HOME/.local/share/swiftly/bin/swift" sdk list
      - name: Cross-build aarch64 tests
        run: swift build --build-tests --swift-sdk "$SWIFT_ANDROID_SDK_ID" --triple aarch64-unknown-linux-android28
      - name: Start x86_64 emulator
        run: |
          # The system image lives in a cached directory linked into the SDK.
          mkdir -p ~/android-sdk-extra/system-images "$ANDROID_HOME/system-images"
          ln -sfn ~/android-sdk-extra/system-images/android-35 "$ANDROID_HOME/system-images/android-35"
          if [[ ! -d ~/android-sdk-extra/system-images/android-35/google_apis/x86_64 ]]; then
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$AVD_IMAGE"
          fi
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n jp2k-ci -k "$AVD_IMAGE" --force
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd jp2k-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          until [[ $(adb shell getprop sys.boot_completed | tr -d '\r') == 1 ]]; do sleep 5; done
      - name: Test x86_64
        run: bash Scripts/android-test.sh x86_64-unknown-linux-android28
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-emulator-log
          path: emulator.log

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: docker run --rm --entrypoint bash -v "$PWD:/src" -w /src ghcr.io/realm/swiftlint:0.65.1 -lc 'swiftlint lint --strict && bash Scripts/lint-selftest.sh'
