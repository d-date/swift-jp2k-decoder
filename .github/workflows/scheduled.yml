name: Extended checks
# Manual only (private repository): long fuzz run, exhaustive corrupt-input
# sweep and the release benchmark.
on:
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    timeout-minutes: 300
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .conformance-data
          key: openjpeg-data-39524bd3a601d90ed8e0177559400d23945f96a9
      - name: Fetch conformance data
        run: bash Scripts/fetch-conformance.sh .conformance-data
      - name: Long fuzz run
        env:
          JP2K_CONFORMANCE_DIR: ${{ github.workspace }}/.conformance-data
        run: |
          bash Fuzz/build.sh
          bash Fuzz/run.sh 14400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts
          path: Fuzz/artifacts

  # Full truncation / bit-flip sweep over every fixture (Task 17); too slow for
  # every push, so it runs here in release mode, on demand.
  exhaustive-corrupt:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-release-6.4.1-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: spm-linux-release-6.4.1-
      - name: Exhaustive corrupt-input sweep
        env:
          JP2K_EXHAUSTIVE: "1"
        run: swift test -c release --filter CorruptCorpusTests

  benchmark:
    timeout-minutes: 300
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .conformance-data
          key: openjpeg-data-39524bd3a601d90ed8e0177559400d23945f96a9
      - name: Fetch conformance data
        run: bash Scripts/fetch-conformance.sh .conformance-data
      - name: Benchmark
        env:
          JP2K_CONFORMANCE_DIR: ${{ github.workspace }}/.conformance-data
        run: swift run -c release jp2k-bench
